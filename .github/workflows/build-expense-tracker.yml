name: Build Expense Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - "expense-tracker/**"
      - ".github/workflows/build-expense-tracker.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools python3-wheel build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools cython==0.29.34

      - name: Build debug APK
        working-directory: expense-tracker
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: expense-tracker/bin/*.apk
          if-no-files-found: error
